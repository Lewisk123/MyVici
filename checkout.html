<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#10110f">
  <title>Secure checkout | MYVICI</title>
  <link rel="icon" href="assets/myvici-emblem-transparent.png" type="image/png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#10110f;color:#fff;font:16px/1.6 Arial,sans-serif}main{max-width:540px;margin:8vh auto;padding:28px}img{width:64px;height:auto}h1{font-size:32px;line-height:1.2;margin:28px 0 16px}p{margin:16px 0}a{color:#c1fa3c}button{display:block;width:100%;margin:28px 0;padding:18px;background:#c1fa3c;color:#10110f;border:0;font:700 16px Arial,sans-serif;cursor:pointer}button:disabled{opacity:.7;cursor:wait}a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:5px}[hidden]{display:none!important}
  </style>
  <script src="assets/redesign/checkout.js" defer></script>
</head>
<body>
  <main>
    <a href="/" aria-label="MYVICI home"><img src="assets/myvici-emblem-transparent.png" alt="MYVICI"></a>
    <h1>MYVICI Organiser Bag</h1>
    <p>One bag. Your 5% automatic discount and delivery will be shown at checkout.</p>
    <p id="checkout-status" role="status" aria-live="polite">Opening your secure checkout…</p>
    <button id="checkout-retry" type="button" hidden>Try again</button>
    <noscript><p>Enable JavaScript to open secure checkout, or <a href="mailto:hello@myvici.com">email us for help ordering</a>.</p></noscript>
    <p><a href="/#shop">Back to the organiser</a></p>
    <p>Need a hand? <a href="mailto:hello@myvici.com">hello@myvici.com</a></p>
  </main>
</body>
</html>
