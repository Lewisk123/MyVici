<!-- MYVICI Homepage V1 - Shopify Custom Liquid Section
Paste this into a Shopify Custom Liquid section on the homepage.
Replace assets/hero-camper.png and other image URLs with Shopify uploaded image links.
-->

<style>
  :root {
    --mv-black: #050607;
    --mv-charcoal: #101214;
    --mv-soft: #1b1f22;
    --mv-white: #f5f5f2;
    --mv-muted: #a7aca8;
    --mv-lime: #9bd30b;
    --mv-line: rgba(155, 211, 11, 0.28);
  }

  body {
    margin: 0;
    background: var(--mv-black);
    color: var(--mv-white);
    font-family: Inter, system-ui, sans-serif;
  }

  .hero {
    min-height: 100vh;
    display: flex;
    align-items: flex-end;
    padding: 80px;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.50) 40%, rgba(0,0,0,0.22) 100%),
      url('assets/hero-camper.png') center/cover no-repeat;
  }

  .content {
    max-width: 760px;
  }

  .eyebrow {
    color: #9bd30b;
    text-transform: uppercase;
    letter-spacing: .22em;
    font-size: 12px;
    font-weight: 800;
  }

  h1 {
    font-size: clamp(52px, 8vw, 110px);
    line-height: .92;
    margin: 18px 0;
    text-transform: uppercase;
  }

  h1 span {
    color: #9bd30b;
  }

  p {
    color: #a7aca8;
    font-size: 18px;
    line-height: 1.7;
  }

  .buttons {
    display: flex;
    gap: 14px;
    margin-top: 30px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 16px 24px;
    border-radius: 999px;
    text-decoration: none;
    text-transform: uppercase;
    font-weight: 800;
    letter-spacing: .08em;
  }

  .primary {
    background: #9bd30b;
    color: black;
  }

  .secondary {
    border: 1px solid rgba(255,255,255,.2);
    color: white;
  }
</style>

<section class="hero">
  <div class="content">
    <div class="eyebrow">Geared For Greatness</div>
    <h1>Built for<br><span>the journey.</span></h1>
    <p>
      Premium performance kit storage for race day, training, travel and adventure.
    </p>

    <div class="buttons">
      <a href="#" class="btn primary">Shop Founder Drop</a>
      <a href="#" class="btn secondary">Join Next Release</a>
    </div>
  </div>
</section>
